name: Instagram + Pinterest Automation

# Manual trigger + 3 daily scheduled runs at peak IST engagement hours.
# Each day: 2 images + 1 video, all cross-posted to Instagram + Pinterest.
#
# Cron is in UTC. IST = UTC + 5:30.
#   08:00 IST = 02:30 UTC  -> slot 1 (morning IMAGE)
#   12:30 IST = 07:00 UTC  -> slot 2 (lunch VIDEO — alternates web-design / github-freelancing)
#   18:00 IST = 12:30 UTC  -> slot 3 (evening IMAGE)
on:
  workflow_dispatch:
    inputs:
      date_override:
        description: "Optional date override (YYYY-MM-DD). Defaults to today UTC."
        required: false
        default: ""
      slot_override:
        description: "Slot 1-3 (1=morning image, 2=lunch video, 3=evening image). Defaults to auto."
        required: false
        default: ""
      mode_override:
        description: "Force mode: image or video (overrides slot-based detection)."
        required: false
        default: ""
      dry_run:
        description: "Dry-run: validate everything but skip the Composio publish call."
        type: boolean
        required: false
        default: false

  schedule:
    - cron: "30 2 * * *"    # 08:00 IST - slot 1 (morning IMAGE)
    - cron: "0 7 * * *"     # 12:30 IST - slot 2 (lunch VIDEO)
    - cron: "30 12 * * *"   # 18:00 IST - slot 3 (evening IMAGE)

permissions:
  contents: write

concurrency:
  group: instagram-automation-${{ github.event.inputs.slot_override || 'auto' }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25    # increased for video rendering

    env:
      COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
      COMPOSIO_CONNECTED_ACCOUNT_ID: ${{ secrets.COMPOSIO_CONNECTED_ACCOUNT_ID }}
      COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      PINTEREST_CONNECTED_ACCOUNT_ID: ${{ secrets.PINTEREST_CONNECTED_ACCOUNT_ID }}
      PINTEREST_USER_ID: ${{ secrets.PINTEREST_USER_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Ensure ffmpeg is available for video rendering (pre-installed on ubuntu-latest)
          ffmpeg -version | head -1 || echo "ffmpeg not found"

      - name: Determine run date, slot, and mode
        id: meta
        run: |
          # Date
          if [ -n "${{ github.event.inputs.date_override }}" ]; then
            echo "date=${{ github.event.inputs.date_override }}" >> "$GITHUB_OUTPUT"
          else
            echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          fi

          # Slot: from input, or auto-compute from current UTC hour
          SLOT_INPUT="${{ github.event.inputs.slot_override }}"
          if [ -n "$SLOT_INPUT" ]; then
            SLOT="$SLOT_INPUT"
          else
            UTC_HOUR=$(date -u +%H)
            case "$UTC_HOUR" in
              01|02|03) SLOT=1 ;;   # around 02:30 UTC (08:00 IST morning) — IMAGE
              06|07|08) SLOT=2 ;;   # around 07:00 UTC (12:30 IST lunch) — VIDEO
              11|12|13) SLOT=3 ;;   # around 12:30 UTC (18:00 IST evening) — IMAGE
              *) SLOT=1 ;;
            esac
          fi
          echo "slot=$SLOT" >> "$GITHUB_OUTPUT"

          # Mode: image or video. Slot 2 = video, slots 1+3 = image.
          # Can be overridden via mode_override input.
          MODE_INPUT="${{ github.event.inputs.mode_override }}"
          if [ -n "$MODE_INPUT" ]; then
            MODE="$MODE_INPUT"
          elif [ "$SLOT" = "2" ]; then
            MODE="video"
          else
            MODE="image"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "[INFO] Date: ${{ steps.meta.outputs.date }}  Slot: $SLOT  Mode: $MODE"

      # ================================================================ IMAGE MODE
      - name: Generate image content
        if: steps.meta.outputs.mode == 'image'
        run: |
          python scripts/generate_content.py \
            --date "${{ steps.meta.outputs.date }}" \
            --slot "${{ steps.meta.outputs.slot }}" \
            --out-dir content

      - name: Commit generated image to repo (for public raw URL)
        if: steps.meta.outputs.mode == 'image'
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          IMAGE_PATH="content/images/${DATE}-${SLOT}.png"
          STORY_PATH="content/images/${DATE}-${SLOT}-story.png"
          if [ -f "$IMAGE_PATH" ]; then
            bash scripts/git_push_retry.sh "chore(content): generated image for ${DATE} slot ${SLOT}" "$IMAGE_PATH" "$STORY_PATH"
            echo "[INFO] Waiting 20s for raw URL CDN propagation..."
            sleep 20
          else
            echo "[ERROR] Image file not found at $IMAGE_PATH" && exit 1
          fi

      - name: Write public raw URL into image manifest
        if: steps.meta.outputs.mode == 'image'
        id: url
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          SHA=$(git rev-parse HEAD)
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"
          RAW_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${SHA}/content/images/${DATE}-${SLOT}.png"
          STORY_URL="https://raw.githubusercontent.com/${OWNER}/${REPO}/${SHA}/content/images/${DATE}-${SLOT}-story.png"
          echo "image_url=$RAW_URL" >> "$GITHUB_OUTPUT"
          echo "[INFO] Image URL: $RAW_URL"

          python - <<PY
          import json
          date = "${DATE}"
          slot = "${SLOT}"
          path = f"content/{date}-{slot}.json"
          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)
          data["image_url"] = "${RAW_URL}"
          data["story_image_url"] = "${STORY_URL}"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, ensure_ascii=False)
          print(f"[INFO] Patched {path} with image_url + story_image_url")
          PY

      - name: Publish image to Instagram + Pinterest
        if: steps.meta.outputs.mode == 'image'
        id: publish_image
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          # Instagram
          python scripts/publish_instagram.py \
            --manifest "content/${DATE}-${SLOT}.json" \
            --history "content/history.json" \
            $DRY_FLAG || echo "[WARN] Instagram publish failed."
          # Pinterest
          echo "[INFO] Cross-posting to Pinterest..."
          python scripts/publish_pinterest.py \
            --manifest "content/${DATE}-${SLOT}.json" \
            --history "content/history.json" \
            --board-name "Web Design Tips for Small Business" \
            $DRY_FLAG || echo "[WARN] Pinterest publish failed (non-fatal)."

      - name: Commit image history & manifest
        if: always() && steps.meta.outputs.mode == 'image'
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          SLOT="${{ steps.meta.outputs.slot }}"
          bash scripts/git_push_retry.sh "chore(content): record publication for ${DATE} slot ${SLOT}" "content/history.json" "content/${DATE}-${SLOT}.json" || true

      # ================================================================ VIDEO MODE
      - name: Render video + upload to GitHub Release
        if: steps.meta.outputs.mode == 'video'
        id: render_video
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/render_video.py \
            --date "$DATE" \
            --out-dir content

      - name: Publish video to Instagram Reels + Pinterest
        if: steps.meta.outputs.mode == 'video' && steps.render_video.outcome == 'success'
        id: publish_video
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python scripts/publish_video.py \
            --manifest "content/${DATE}-video.json" \
            --history "content/history.json" \
            $DRY_FLAG

      - name: Commit video history & manifest
        if: always() && steps.meta.outputs.mode == 'video'
        run: |
          DATE="${{ steps.meta.outputs.date }}"
          bash scripts/git_push_retry.sh "chore(content): record video publication for ${DATE}" "content/history.json" "content/${DATE}-video.json" || true

      # ================================================================ Summary
      - name: Summary
        if: always()
        run: |
          echo "### Instagram + Pinterest Automation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Date:** ${{ steps.meta.outputs.date }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Slot:** ${{ steps.meta.outputs.slot }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Mode:** ${{ steps.meta.outputs.mode }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Dry run:** ${{ github.event.inputs.dry_run || 'false' }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.meta.outputs.mode }}" = "image" ]; then
            echo "- **Image URL:** ${{ steps.url.outputs.image_url }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Publish:** ${{ steps.publish_image.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Video render:** ${{ steps.render_video.outcome }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Video publish:** ${{ steps.publish_video.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Email CTA on all posts: visualhookdesign@gmail.com" >> "$GITHUB_STEP_SUMMARY"
          echo "Portfolio link on all Pinterest pins: https://professional-x.github.io/visualhk-designs/" >> "$GITHUB_STEP_SUMMARY"
